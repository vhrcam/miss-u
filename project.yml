name: MissU
options:
  bundleIdPrefix: tot.mgmt
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
settings:
  base:
    DEVELOPMENT_TEAM: R656WWS92D
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  MissU:
    type: application
    platform: iOS
    sources:
      - path: MissU
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - target: MissUWidget
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tot.mgmt.MissU
        PRODUCT_NAME: MissU
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/MissU-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Miss U
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/MissU.entitlements
  MissUWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MissUWidget
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tot.mgmt.MissU.Widget
        PRODUCT_NAME: MissUWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/MissUWidget-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Miss U
        CODE_SIGN_ENTITLEMENTS: Config/MissUWidget.entitlements
        SKIP_INSTALL: YES
